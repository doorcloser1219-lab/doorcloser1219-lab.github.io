    return a;
  });

  // 确定性伪随机（基于索引），避免 resize 时位置抖动
  function rnd(i) {
    var x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);

  function layout() {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;

    var n = nodes.length;
    var golden = Math.PI * (3 - Math.sqrt(5)); // 黄金角

      var r = Math.sqrt((i + 0.5) / n);       // 0..1，中心密、边缘疏 → 聚成一团

      nodes[i].style.top = y + 'px';
